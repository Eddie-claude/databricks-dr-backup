bundle:
  name: dr-backup

# ── Variables globales ────────────────────────────────────────────────────────
variables:
  backup_root:
    description: "Chemin ADLS racine du backup (abfss://...)"
    default: "abfss://uc-data@st10keyitdpdrpdevchn00.dfs.core.windows.net/backup"
  lib_path:
    description: "Chemin workspace vers lib/"
    default: "/Workspace/Shared/dr-backup/lib"
  notification_email:
    description: "Email de notification en cas d'échec"
    default: "efi@keyit.ch"
  retain_daily:
    description: "Rétention quotidienne : nombre de jours de restauration point-in-time (Delta log). Étendu à 30j depuis l'abandon du snapshot weekly (Option C)."
    default: "30"
  retain_weekly:
    description: "Legacy — snapshot weekly abandonné (Option C, non supporté par UC sur tables non-MANAGED). Sert uniquement à purger les anciens snapshots déjà existants."
    default: "4"
  retain_monthly:
    description: "Rétention mensuelle : nombre de mois (1 backup/mois)"
    default: "3"
  dry_run:
    description: "Dry-run retention (true = simulation, aucune suppression)"
    default: "false"
  max_parallel_monthly:
    description: "Threads parallèles pour le snapshot mensuel (DEEP CLONE)"
    default: "8"

# ── Ressources ────────────────────────────────────────────────────────────────
resources:
  jobs:

    # ── Job 1 : Backup journalier (incrémental, ~30min-2h) ────────────────────
    dr_backup_daily:
      name: dr-backup-daily
      description: "DR Backup journalier — UC metadata + Delta DEEP CLONE incrémental + diff + rapport + retention/VACUUM"

      tags:
        project: databricks-dr
        managed_by: dab

      schedule:
        quartz_cron_expression: "0 0 1 * * ?"   # 01:00 UTC chaque nuit
        timezone_id: UTC
        pause_status: PAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: orchestrator
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            spark_conf:
              spark.master: "local[*, 8]"
              spark.databricks.cluster.profile: "singleNode"
            custom_tags:
              ResourceClass: "SingleNode"
          timeout_seconds: 28800   # 8h — suffisant pour backup incrémental
          notebook_task:
            notebook_path: ./notebooks/00_orchestrator.py
            base_parameters:
              backup_root:    ${var.backup_root}
              lib_path:       ${var.lib_path}
              retain_daily:   ${var.retain_daily}
              retain_weekly:  ${var.retain_weekly}
              retain_monthly: ${var.retain_monthly}
              dry_run:        ${var.dry_run}
          email_notifications:
            on_failure:
              - ${var.notification_email}

    # ── Job 2 : Snapshot mensuel DEEP CLONE (1er du mois, ~18-24h) ───────────
    dr_backup_monthly:
      name: dr-backup-monthly
      description: "DR Snapshot mensuel — DEEP CLONE complet vers snapshots/monthly/ + nettoyage archives expirées"

      tags:
        project: databricks-dr
        managed_by: dab

      schedule:
        quartz_cron_expression: "0 0 2 1 * ?"   # 02:00 UTC le 1er de chaque mois
        timezone_id: UTC
        pause_status: PAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: monthly_snapshot
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_DS4_v2"
            num_workers: 4
            data_security_mode: "SINGLE_USER"
          timeout_seconds: 86400   # 24h — couvre le DEEP CLONE de 17 TB
          notebook_task:
            notebook_path: ./notebooks/06_retention.py
            base_parameters:
              backup_root:    ${var.backup_root}
              retain_daily:   ${var.retain_daily}
              retain_weekly:  ${var.retain_weekly}
              retain_monthly: ${var.retain_monthly}
              dry_run:        ${var.dry_run}
              enable_monthly: "true"
              force_snapshot: "false"
              max_parallel:   ${var.max_parallel_monthly}
          email_notifications:
            on_failure:
              - ${var.notification_email}

    # ── Job 3 : Game Day DR — test de restauration automatisé (à la demande) ──
    dr_gameday:
      name: dr-gameday
      description: "DR Game Day — test de restauration automatisé et non-interactif sur le catalog de démo (source_demo01), sans intervention manuelle. Déclenchement à la demande uniquement (pas de schedule)."

      tags:
        project: databricks-dr
        managed_by: dab

      max_concurrent_runs: 1

      tasks:
        - task_key: gameday
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            spark_conf:
              spark.master: "local[*, 8]"
              spark.databricks.cluster.profile: "singleNode"
            custom_tags:
              ResourceClass: "SingleNode"
          timeout_seconds: 3600   # 1h — largement suffisant pour un jeu de données de démo (~20 lignes)
          notebook_task:
            notebook_path: ./notebooks/demo/07_gameday.py
            base_parameters:
              backup_root: ${var.backup_root}
              lib_path:    ${var.lib_path}
          email_notifications:
            on_failure:
              - ${var.notification_email}

# ── Targets ───────────────────────────────────────────────────────────────────
targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2547670924000766.6.azuredatabricks.net
    variables:
      backup_root: "abfss://uc-data@st10keyitdpdrpdevchn00.dfs.core.windows.net/backup-dev"
      lib_path: "/Workspace/Shared/dr-backup-dev/lib"

  prod:
    mode: production
    workspace:
      host: https://adb-2547670924000766.6.azuredatabricks.net
      root_path: /Workspace/Shared/dr-backup/.bundle/${bundle.name}/${bundle.target}
    variables:
      backup_root: "abfss://uc-data@st10keyitdpdrpdevchn00.dfs.core.windows.net/backup"
      lib_path: "/Workspace/Shared/dr-backup/lib"
